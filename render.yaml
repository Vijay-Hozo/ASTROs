services:
  - type: web
    name: ps3-rule-engine-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: FRONTEND_URL
        value: https://ps3-rule-engine.vercel.app
      - key: PORT
        value: 8000
    rootDir: backend
